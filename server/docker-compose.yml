# Local development and tests: PostgreSQL 17 + pgvector, and the service on http://127.0.0.1:8080.
#   docker compose -f server/docker-compose.yml up -d db        # just the database (for dotnet test)
#   docker compose -f server/docker-compose.yml up -d --build   # database and service
# No password at all: the database trusts connections and listens on 127.0.0.1 only, so there is
# no credential to leak. Never copy this to anything reachable from another machine.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: xray
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: xray
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xray"]
      interval: 2s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      Share__Database: "Host=db;Username=xray;Database=xray"
      # Without a key the TMDb credits check is skipped (local only); set TMDB_API_KEY to test it.
      Share__TmdbApiKey: "${TMDB_API_KEY:-}"
      Share__AllowWithoutTmdb: "true"
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
